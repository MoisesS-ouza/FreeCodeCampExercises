<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="CSS/stylized_to-do_list.css">
</head>

<body>
    <h1>My To-Do List</h1>
    <ul class="todo-list">
        <li>
            <input type="checkbox" id="OOP">
            <label for="OOP">Do OOP homework</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://www.w3schools.com/python/python_oop.asp" target="_blank">Visit Python OOP website</a></li>
            </ul>
        </li>

        <li>
            <input type="checkbox" id="presentation">
            <label for="presentation">Give a presentation friday(06/26)</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://hbr.org/2013/06/how-to-give-a-killer-presentation" target="_blank">How to give a killer presentation (Harvard)</a></li>
            </ul>
        </li>

        <li>
            <input type="checkbox" id="frontend">
            <label for="frontend">Study HTML, CSS and JavaScript</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://www.freecodecamp.org/" target="_blank">FreeCodeCamp website</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="python">
            <label for="python">Study Python</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://docs.python.org/3/" target="_blank">Python Documentation</a></li>
            </ul>
        </li>
    </ul>
</body>

</html>
