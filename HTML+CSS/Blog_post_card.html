<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post Card</title>
    <link rel="stylesheet" href="CSS/blog_post_card.css">
</head>

<body>
    <div class="blog-post-card">
        <img class="post-img" src="https://www.fullstackpython.com/img/logos/py.png" alt="Python(Programming language) logo">
        <div class="post-content">
            <h2 class="post-title">Learn the basics of Python in 2026</h2>
            <p class="post-excerpt">Learn functions, loops, classes and more through reading all this documentation</p>
            <a class="read-more" href="https://docs.python.org/3/"> Read More</a>
        </div>
    </div>

    <div class="blog-post-card">
        <img class="post-img" src="https://assets.pluhe.com/blog/small/JqxsAtj7G5bc4D8vfE5LKrGjLhm2dgYi7aRtEXBd.jpg" alt="JavaScript(Programming language) logo">
        <div class="post-content">
            <h2 class="post-title">Learn web development with JavaScript</h2>
            <p class="post-excerpt">Learn how to make incredible websites with JavaScript</p>
            <a class="read-more" href="https://developer.mozilla.org/en-US/docs/Web/JavaScript"> Read More</a>
        </div>
    </div>
</body>
</html>
